            }
        } catch (Exception e1) {
            try {
                if (moe.shizuku.api.Shizuku.checkSelfPermission() != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                    moe.shizuku.api.Shizuku.requestPermission(0);
                }
            } catch (Exception e2) {}

name: Build S23 Ultra Control APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Extract project
        run: |
          mkdir project
          unzip -o *.zip -d project
          find project -name "MainActivity.java"

      - name: Patch Shizuku
        run: |
          python3 -c "
          import pathlib
          for p in pathlib.Path('project').rglob('MainActivity.java'):
              t = p.read_text()
              old = 'Process p = Shizuku.newProcess(command, null, null);'
              new = '''Process p;
          try {
              java.lang.reflect.Method m = Shizuku.class.getDeclaredMethod(\"newProcess\", String[].class, String[].class, String.class);
              m.setAccessible(true);
              p = (Process) m.invoke(null, command, null, null);
          } catch (Exception e) {
              throw new RuntimeException(e);
          }'''
              if old in t:
                  p.write_text(t.replace(old, new))
                  print(f'patched {p}')
              else:
                  print(f'not found in {p}')
          "

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S23-Ultra-Control-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

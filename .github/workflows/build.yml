name: Build S23 Anti Throttling

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/s23/antithrottle
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "S23AntiThrottle"
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.s23.antithrottle'
            compileSdk 34
            defaultConfig { applicationId 'com.s23.antithrottle'; minSdk 28; targetSdk 34; versionCode 1; versionName '1.0' }
            buildTypes { debug { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'dev.rikka.shizuku:api:13.1.5' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="S23 Anti Throttling" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <provider android:name="rickyshizuku.shizuku.ShizukuProvider" android:authorities="${applicationId}.shizuku" android:exported="true" android:multiprocess="true" />
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/s23/antithrottle/MainActivity.java << 'EOF'
          package com.s23.antithrottle;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          import rickyshizuku.shizuku.Shizuku;
          import java.io.*;
          public class MainActivity extends Activity {
            TextView tv;
            void runCmd(String cmd, String info){
              tv.setText(info + "\n\nLagi proses...");
              new Thread(() -> {
                try {
                  Process p = Shizuku.newProcess(new String[]{"sh","-c",cmd}, null, null);
                  BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                  String line; StringBuilder sb = new StringBuilder();
                  while((line=r.readLine())!=null) sb.append(line).append("\n");
                  p.waitFor();
                  runOnUiThread(() -> tv.setText(info + "\n\nSELESAI!\n"+sb.toString()));
                } catch(Exception e){ runOnUiThread(() -> tv.setText("Error: "+e.getMessage())); }
              }).start();
            }
            @Override protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(40,40,40,40);
              tv = new TextView(this); tv.setText("S23 Anti Throttling\n\nBiar gak gampang trotling pas panas.");
              tv.setTextSize(18);
              Button btnIzin = new Button(this); btnIzin.setText("1. IZINKAN SHIZUKU");
              btnIzin.setOnClickListener(v -> { try{ Shizuku.requestPermission(0); } catch(Exception e){ tv.setText("Error: "+e.getMessage()); } });
              Button btnOn = new Button(this); btnOn.setText("2. AKTIFKAN ANTI THROTTLING");
              btnOn.setOnClickListener(v -> runCmd(
                "pm disable-user --user 0 com.samsung.android.game.gos; " +
                "pm disable-user --user 0 com.samsung.android.game.gametools; " +
                "settings put global sem_enhanced_cpu_responsiveness 1; " +
                "settings put global game_auto_temperature_control 0; " +
                "cmd thermalservice override-status 0; " +
                "dumpsys deviceidle disable; " +
                "echo GOS OFF, Thermal dilonggarkan",
                "ANTI THROTTLING ON - HP bakal lebih ngebut, lebih panas dikit itu normal."));
              Button btnOff = new Button(this); btnOff.setText("3. MATIKAN (BALIK NORMAL)");
              btnOff.setOnClickListener(v -> runCmd(
                "pm enable --user 0 com.samsung.android.game.gos; " +
                "pm enable --user 0 com.samsung.android.game.gametools; " +
                "settings put global sem_enhanced_cpu_responsiveness 0; " +
                "cmd thermalservice override-status 1; " +
                "dumpsys deviceidle enable; " +
                "echo Balik normal",
                "BALIK NORMAL - Throttling aktif lagi."));
              l.addView(tv); l.addView(btnIzin); l.addView(btnOn); l.addView(btnOff);
              setContentView(l);
              try {
                Shizuku.addRequestPermissionResultListener((code, res) -> runOnUiThread(() -> tv.setText("Izin Shizuku: "+res+" (0 = Berhasil, silahkan pencet tombol 2)")));
                if(Shizuku.checkSelfPermission() != 0) Shizuku.requestPermission(0);
                else tv.setText("S23 Anti Throttling\n\nIzin sudah ada! Langsung pencet tombol 2.");
              } catch(Exception e){ tv.setText("Error awal: "+e.getMessage()); }
            }
          }
          EOF
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: List APK
        run: |
          find . -name "*.apk" -type f
          ls -R app/build/outputs/ || echo "folder gak ketemu"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S23-Anti-Throttling-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

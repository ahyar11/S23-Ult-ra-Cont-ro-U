name: Build S23 Ultra Control APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accept-android-sdk-licenses: false

      - name: Accept SDK Licenses (Fix Error y/N)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Extract project
        run: |
          mkdir project
          unzip -o *.zip -d project

      - name: Build APK
        run: |
          cd project
          # Cari folder yang ada gradlew-nya (kadang ada sub-folder)
          if [ ! -f "./gradlew" ]; then
            cd $(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S23-Ultra-Control-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
